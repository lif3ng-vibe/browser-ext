name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  check:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm compile

      - name: Test
        run: pnpm test

  build:
    name: build (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 注入版本(仅 tag 构建)
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "WXT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: 构建 ${{ matrix.browser }}
        run: pnpm exec wxt build -b ${{ matrix.browser }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.browser }}
          path: .output/${{ matrix.browser }}-mv*/

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 注入版本(仅 tag 构建)
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "WXT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: 打包三浏览器 zip
        run: pnpm zip

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            .output/*-chrome.zip
            .output/*-firefox.zip
            .output/*-edge.zip
